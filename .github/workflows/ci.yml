name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: Java (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build Web UI for the plugin JAR
        working-directory: web
        run: pnpm build
      - name: Build and test
        shell: bash
        run: ./gradlew build verifyJava8 --console=plain
      - name: Report plugin JAR size
        shell: bash
        run: ./gradlew :plugin:reportPluginJarSize --console=plain

  compat:
    name: Compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 25 for Paper
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up JDK 21 for Gradle
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build Web UI for the plugin JAR
        working-directory: web
        run: pnpm build
      - name: Build and verify plugin JARs
        shell: bash
        run: |
          ./gradlew :plugin:shadowJar :plugin:verifyPluginJar \
            :tests:fixtures:conflicting-plugin:shadowJar --console=plain
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve server cache key
        id: compat_cache
        shell: bash
        run: |
          key=$(python tests/compat-matrix/harness.py cache-key --entry paper-26.3)
          echo "key=${key}-${{ runner.os }}" >> "$GITHUB_OUTPUT"
      - name: Cache Paper downloads
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: tests/compat-matrix/.cache
          key: ${{ steps.compat_cache.outputs.key }}
      - name: Harness unit tests
        shell: bash
        run: python -m unittest discover -s tests/compat-matrix -p 'test_*.py'
      - name: Run Paper smoke entry
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            java25="$(cygpath -w "$JAVA_HOME_25_X64/bin/java.exe")"
          else
            java25="$JAVA_HOME_25_X64/bin/java"
          fi
          python -c "import subprocess,sys; subprocess.run([sys.argv[1], '-version'], check=True)" "$java25"
          python tests/compat-matrix/harness.py run \
            --entry paper-26.3 \
            --java "$java25" \
            --plugin-jar plugin/build/libs/DeployMC-0.1.0-SNAPSHOT.jar \
            --conflict-plugin-jar tests/fixtures/conflicting-plugin/build/libs/deploymc-test-conflicting-libs-1.0.0.jar \
            --cache-dir tests/compat-matrix/.cache \
            --result tests/compat-matrix/results/compat-v1-${{ matrix.os }}.json
      - name: Upload compatibility artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compat-v1-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            tests/compat-matrix/results/
            tests/compat-matrix/work/run-*/logs/

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  cli:
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: cli
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy
      - name: Pytest
        run: python -m pytest

  spec:
    name: Spec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/spec
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/spec/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint specifications
        run: npm run lint
      - name: Test specification checkers
        run: npm test

  i18n:
    name: i18n
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check message catalogs
        run: node tools/i18n/check
      - name: Test the checker
        run: node --test tools/i18n/test/check.test.cjs
      - name: Verify the generated status is current
        run: |
          node tools/i18n/check --write-status
          git diff --exit-code -- docs/i18n/STATUS.md
