name: Labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.tsv
      - .github/workflows/labels.yml
  workflow_dispatch:

concurrency:
  group: labels-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Apply labels from .github/labels.tsv
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS=$'\t' read -r name description color; do
            color="${color%$'\r'}"
            if [[ -z "$name" || "$name" == \#* ]]; then
              continue
            fi
            if [[ -z "$description" || ! "$color" =~ ^[0-9a-fA-F]{6}$ ]]; then
              echo "invalid row: name=$name description=$description color=$color" >&2
              exit 1
            fi
            gh label create "$name" --repo "$GITHUB_REPOSITORY" \
              --description "$description" --color "$color" --force
            count=$((count + 1))
          done < .github/labels.tsv
          echo "synced $count labels"
