# DeployMC configuration example
#
# Status: the loader validates the structural rules in config.schema.json next to
# this file; if the example and the schema disagree, the schema wins.
#
# This example is a complete, schema-valid configuration for token mode. The API
# listens on loopback only; place a TLS terminator in front of it for remote access.
# Values shown are the documented defaults unless a comment says otherwise.

config-version: 1
language: en

bind:
  # Loopback only. Cloudflare Tunnel connects locally; the port is never exposed
  # directly to the internet.
  address: 127.0.0.1
  port: 8080
  allow-non-loopback: false
  # CIDRs whose X-Forwarded-For / CF-Connecting-IP headers are believed.
  trusted-proxies: []

auth:
  # `token` accepts host-provisioned API tokens. `cloudflare` verifies the
  # RS256 JWT assertion header only; forwarded identity headers are ignored.
  # `local-onetime` is a loopback-only local testing mode: it prints one short-lived
  # console token at startup and requires bind.allow-non-loopback: true if the
  # address is not loopback. See docs/development/implementation-status.md for
  # the current implementation state of each mode.
  mode: token
  token:
    # Used by `/deploymc token create`. Clamped to max-ttl-days. Both values are
    # restart-only because the provisioning runtime is built at startup.
    default-ttl-days: 90
    max-ttl-days: 365
  # To select local testing mode, change mode above to `local-onetime` and add:
  # local-onetime:
  #   ttl-minutes: 15
  #   max-attempts: 5
  # To select Cloudflare Access, change mode above to `cloudflare` and add:
  # cloudflare:
  #   team-domain: "example.cloudflareaccess.com"
  #   audience: "replace-with-access-aud-tag"
  #   clock-skew-seconds: 60
  #   jwks-cache-max-age-seconds: 3600
  #   jwks-max-stale-seconds: 86400
  #   require-shared-secret-header: ""  # reserved; must stay empty
  # Token records live under plugins/DeployMC/tokens.d/*.json and are never
  # readable or writable through the API. Token creation is refused in
  # Cloudflare mode.

sandbox:
  # Relative to the server's `plugins` directory.
  root: "."
  protected-paths:
    - ".deploymc/**"
    - "DeployMC/**"
  deny-patterns: []
  max-file-size-mb: 10
  max-upload-size-mb: 64
  max-list-entries: 5000
  # Following symlinks weakens containment. Leave this false unless you understand
  # the risk and have tested the target platform.
  follow-symlinks: false

snapshots:
  directory: ".deploymc/history"
  retention:
    max-versions-per-file: 50
    max-age-days: 90
    max-total-size-mb: 2048

deploy:
  staging-directory: ".deploymc/staging"
  restart:
    # `shutdown-only` requires an external supervisor (systemd, Docker, Pterodactyl,
    # Windows service) that starts the process again. `none` never claims a restart.
    mode: shutdown-only
    countdown-seconds: 30
    save-before-restart: true
    min-interval-minutes: 5
  verification:
    timeout-seconds: 180
    require-plugin-enabled: true
    fail-patterns: []
    success-patterns: []
  rollback:
    automatic: true
    max-attempts: 2
  approval:
    # With `required: true`, `approver-roles` must be non-empty. The requester can
    # never approve their own deployment.
    required: false
    approver-roles: []
  jar-policy:
    require-descriptor: true
    hash-allowlist-file: ""
    hash-denylist-file: ""

console:
  enabled: true
  buffer-lines: 5000
  command-policy:
    # Evaluation order: deny, then confirm, then allow.
    allow:
      - "*"
    deny:
      - "stop"
      - "op *"
      - "deop *"
    confirm:
      - "reload"
      - "whitelist *"

audit:
  directory: ".deploymc/audit"
  rotate-size-mb: 50
  retention-days: 365
  fsync-policy: "record"
  max-batch-records: 1

limits:
  rate-limit-per-minute: 300
  max-websocket-connections: 50

observability:
  logging:
    format: text
  metrics:
    enabled: false
    permission: server.read

roles:
  admin:
    permissions:
      - "*"
  developer:
    permissions:
      - files.read
      - files.write
      - snapshots.read
      - snapshots.restore
      - deployments.create
      - console.read
    paths:
      allow:
        - "MyRpgPlugin/**"
        - "MyRpgPlugin.jar"
      deny:
        - "**/secrets.yml"
    limits:
      max-upload-mb: 20
  observer:
    permissions:
      - files.read
      - console.read
  ci-deployer:
    permissions:
      - deployments.create
      - deployments.read
      - snapshots.read
    paths:
      allow:
        - "MyRpgPlugin/**"

users:
  # Keys are verified identities: email, service-token common name, or token owner.
  "alice@example.com":
    roles:
      - admin
  "bob@example.com":
    roles:
      - developer
  "ci-service-token":
    roles:
      - ci-deployer

# Unknown identities are denied. This must stay `none` unless every identity that
# can reach the API is intentionally granted a role.
default-role: none

webhooks:
  # Keep false unless a webhook target really lives in a private network. This
  # setting exists to prevent SSRF.
  allow-private-targets: false

telemetry:
  # Opt-in only. No identity, path, file name, or server address is collected.
  enabled: false
