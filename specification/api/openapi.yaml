openapi: 3.1.0

info:
  title: DeployMC API
  version: 0.1.0
  summary: Authenticated REST API for DeployMC.
  description: |
    Normative REST contract for DeployMC. The API is served by the DeployMC plugin,
    binds to `127.0.0.1` by default, and is authenticated by host-provisioned bearer
    tokens in 0.1.0. Remote access requires a TLS terminator.

    **Status: partial.** The authentication gate, health endpoints, the
    `GET /api/v1/server` application handler, and the WP-2.6 file, validation, and snapshot
    transport adapters are implemented. The adapters have server-free contract tests, but no
    running-server smoke test or Web UI consumes them yet. The doctor and metrics routes in
    this document are normative contracts for issue #117; they are not implemented until the
    corresponding product stage is merged. The RBAC contract in
    `specification/security/rbac.md` is normative for issue #59; `/api/v1/me` and role/path
    enforcement must not be claimed before the evaluator is merged. The remaining server
    resource fields and the deployment, console, and audit resources are defined for later
    work packages.

    Rules that apply to every operation:

    - There is no unauthenticated endpoint except `/healthz` and `/readyz`.
    - Errors use RFC 9457 Problem Details with a stable machine-readable `code`.
    - Human-readable `title` and `detail` are localized through `Accept-Language`
      and are never used for program logic.
    - Existing resources use `ETag`/`If-Match`. A missing precondition on a
      destructive write is an error, not a blind overwrite.
    - List resources use cursor pagination with a documented limit.
    - Requests and responses carry a request id for correlation.
    - Breaking changes require a new major API version. Additive changes are
      allowed within `v1`.

    The specification is the source of truth. Behavior changes start here, then in
    the server, clients, and contract tests.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
  contact:
    name: DeployMC maintainers
    url: https://github.com/woxlo1/DeployMC

x-deploymc-implementation-status: partial

servers:
  - url: http://127.0.0.1:8080
    description: |
      Default loopback bind. Binding to another interface requires an explicit
      configuration change and emits a startup warning. TLS is normally terminated
      at Cloudflare; local TLS is optional and not part of this skeleton.

tags:
  - name: Health
    description: Unauthenticated liveness and readiness probes. They reveal no sensitive data.
  - name: Server
    description: Information about the running DeployMC and Minecraft server.
  - name: Files
    description: Sandboxed file listing, reading, writing, moving, upload, and deletion.
  - name: Validation
    description: Server-authoritative content validation for sandbox paths.
  - name: Snapshots
    description: |
      Immutable, content-addressed history for sandbox paths. Metadata and content can
      contain configuration secrets, so every operation requires authentication and is
      subject to the source path's authorization scope once RBAC arrives.
  - name: Diagnostics
    description: |
      Redacted self-diagnostics. Doctor output reports implemented checks and explicitly marks
      unavailable capabilities; it is not a support-tier verdict.
  - name: Metrics
    description: |
      Opt-in aggregate operational metrics behind the normal authentication gate. No high-cardinality
      labels are exposed.

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Liveness probe
      description: |
        Returns `200` when the plugin process is alive and its internal lifecycle has
        started. It does not prove that the transport, data directory, or platform
        adapter are ready. No authentication and no sensitive fields.
      security: []
      responses:
        '200':
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /readyz:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Readiness probe
      description: |
        Returns `200` only after configuration validation, data-lock acquisition,
        snapshot-store recovery, authentication initialization, and transport bind
        have completed. Returns `503` with per-check results while starting, after a
        fatal initialization error, or while shutting down.

        No authentication and no sensitive fields; checks report status, not
        configuration values.
      security: []
      responses:
        '200':
          description: The instance is ready to serve API requests.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: The instance is not ready. The body lists the failing checks.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'

  /api/v1/server:
    get:
      operationId: getServer
      tags: [Server]
      summary: Get server and DeployMC information
      description: |
        Returns the DeployMC version, API version, detected platform information, and
        the capability map for the current runtime.

        A capability key that is absent from the map has the state `UNKNOWN`. Clients
        must treat `UNKNOWN` as unavailable for safety-sensitive operations and must
        degrade visibly instead of claiming success.

        The response is derived from immutable value objects and is safe to cache
        within the lifetime of one server process. The `ETag` changes when the
        capability map or platform information changes.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      responses:
        '200':
          description: Current server information.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '304':
          description: The supplied `If-None-Match` matches the current representation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/server/doctor:
    get:
      operationId: getDoctorReport
      tags: [Diagnostics]
      summary: Get a redacted self-diagnostic report
      description: |
        Returns the same stable `DoctorReport` used by the human and in-UI renderings. Every check
        has a status, an `implemented` flag, a localized explanation, and an optional remediation.
        Checks without a product implementation are always `WARN` and never interpreted as a
        successful verification. The response never contains tokens, file contents, raw paths,
        identities, or remote addresses.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      responses:
        '200':
          description: A redacted doctor report.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/me:
    get:
      operationId: getCurrentIdentity
      tags: [Identity]
      summary: Get the caller's effective identity and permissions
      description: |
        Returns only the caller's own identity kind, opaque identity id, sorted assigned roles,
        and effective permission identifiers in canonical registry order. `*` is expanded and
        never returned. No token secret, digest, raw scope string, raw path glob, or other
        identity's data is returned.

        When `explain` is supplied, the response includes a deterministic decision explanation
        for that permission and optional sandbox-relative `path`. The path is resolved by the
        sandbox resolver before evaluation; raw paths and raw globs are never returned.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      parameters:
        - name: explain
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PermissionIdentifier'
          description: Permission identifier to evaluate for explain mode.
        - name: path
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
          description: Optional sandbox-relative path to evaluate through the sandbox resolver.
      responses:
        '200':
          description: The caller's effective identity, roles, permissions, and optional explanation.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/metrics:
    get:
      operationId: getMetrics
      tags: [Metrics]
      summary: Get aggregate operational metrics
      description: |
        Returns Prometheus text-format metrics. The route exists only when
        `observability.metrics.enabled` is true. It is always behind the authentication gate and
        requires the configured `server.read` permission from the closed RBAC registry; no implicit
        admin equivalence exists.
        Metrics use fixed names and closed low-cardinality label sets; no identity, path, hostname,
        or IP address is exported.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      responses:
        '200':
          description: Prometheus text-format metrics.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            text/plain:
              schema:
                type: string
                description: Prometheus text format 0.0.4.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/files:
    get:
      operationId: listFiles
      tags: [Files]
      summary: List directory entries
      description: |
        Lists one sandbox directory. The path is resolved through the sandbox before any
        file-system access. Entries rejected by the resolver are omitted, never revealed.
        Ordering is deterministic by sandbox-relative path. A listing that exceeds the
        host entry cap is paginated with an opaque cursor.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SandboxPath'
        - name: depth
          in: query
          required: false
          description: Maximum directory depth to include. `1` lists direct children.
          schema:
            type: integer
            minimum: 1
            maximum: 64
            default: 1
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of entries in deterministic path order.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createFileEntry
      tags: [Files]
      summary: Create a file or directory
      description: |
        Creates a new file or directory. An existing target is never replaced; the caller must
        use `PUT /api/v1/files/content` with `If-Match` to overwrite. Text content is submitted
        as a JSON string; binary content uses `POST /api/v1/files/upload`. The configured
        validation gate runs before the file is committed.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntryRequest'
      responses:
        '201':
          description: The entry was created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWriteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteFileEntry
      tags: [Files]
      summary: Delete a file or directory
      description: |
        Deletes one file or an empty directory. Recursive deletion requires `recursive=true`
        and an `expectedEntryCount` that matches the current tree size, including the root.
        A file delete requires `If-Match` with the current revision. The sandbox root
        cannot be deleted (`files.invalid-operation`). The configured snapshot hook
        captures the target before deletion; a missing hook fails closed.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SandboxPath'
        - name: recursive
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: expectedEntryCount
          in: query
          required: false
          description: Required when `recursive=true`; must match the current tree size.
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The entry was deleted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/files/content:
    get:
      operationId: readFileContent
      tags: [Files]
      summary: Read file content
      description: |
        Returns the complete file or a byte range. The `ETag` is the full-file revision
        (`sha256:<lowercase hex>`), so a stale `If-Match` is detected even for a range read.
        Binary content is returned as bytes, never as a JSON string.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SandboxPath'
        - name: Range
          in: header
          required: false
          description: Inclusive start and exclusive end, for example `bytes=0-1023`.
          schema:
            type: string
            pattern: '^bytes=\d*-\d*$'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The complete file content.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Accept-Ranges:
              description: Always `bytes`.
              schema:
                type: string
                const: bytes
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: The requested byte range.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Content-Range:
              description: Range and total size, for example `bytes 0-1023/2048`.
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: The supplied `If-None-Match` matches the current revision.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: writeFileContent
      tags: [Files]
      summary: Write file content
      description: |
        Atomically replaces an existing file, or creates a missing one. Replacing an existing
        file requires `If-Match` with the current revision; a missing precondition is
        `request.precondition-required` and a stale one is `files.revision-conflict`. The
        configured validation gate runs before the target is snapshotted and replaced.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SandboxPath'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The existing file was replaced.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWriteResult'
        '201':
          description: A missing file was created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWriteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/files/move:
    post:
      operationId: moveFileEntry
      tags: [Files]
      summary: Move or rename an entry
      description: |
        Moves a file or directory. Overwriting the destination requires `overwrite=true` and,
        for a file source, `If-Match` with the current source revision. Both source and an
        overwritten destination are snapshotted before the move. Neither endpoint may be
        the sandbox root (`files.invalid-operation`).
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
      responses:
        '200':
          description: The entry was moved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/files/upload:
    post:
      operationId: uploadFileContent
      tags: [Files]
      summary: Upload file content
      description: |
        Streams bytes into a same-directory temporary file, validates the staged content, then
        commits with one atomic move. The upload maximum is the smaller of the host upload and
        file limits. Replacing an existing file requires `If-Match`. The response reports the
        resulting entry and any non-blocking validation warnings.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SandboxPath'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The existing file was replaced.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWriteResult'
        '201':
          description: A missing file was created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWriteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/files/validate:
    post:
      operationId: validateFileContent
      tags: [Validation]
      summary: Validate content for a sandbox path
      description: |
        Runs the host-configured validator registry against submitted content for a path,
        without writing any file. The path is resolved through the sandbox first. An unmatched
        file type returns `matched=false` and must never be presented as validated. ERROR
        findings return `validation.failed`; a limit returns `validation.limit-exceeded` with a
        format-specific issue code in `errors[]`; an unexpected validator failure returns
        `validation.validator-unavailable`.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
      responses:
        '200':
          description: The validation result, including warnings and unmatched types.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/snapshots:
    get:
      operationId: listSnapshots
      tags: [Snapshots]
      summary: List snapshots for a sandbox path
      description: |
        Lists immutable snapshot records for one sandbox-relative path. The path is
        resolved through the sandbox before any store access; protected paths are
        rejected. The path need not exist in the live tree because deletion snapshots
        remain in history. Records are ordered newest first by `created-at`, then by
        opaque id. An empty history is a successful empty page, not `404`.

        Metadata can contain configuration secrets. Every request is authenticated, and
        once RBAC arrives the caller must also hold `snapshots.read` on this path scope.
        Absolute host paths and store-relative file names are never returned.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SandboxPath'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of snapshot metadata, newest first.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/snapshots/{id}:
    get:
      operationId: getSnapshot
      tags: [Snapshots]
      summary: Read one snapshot record
      description: |
        Returns the authoritative metadata for one immutable snapshot. The `ETag` is a
        quoted snapshot id because a committed record never changes. An unknown id and a
        syntactically invalid id both return `404` with `snapshots.not-found`; the server
        does not distinguish them. Once RBAC arrives, the caller must hold
        `snapshots.read` on the record's sandbox path scope.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The snapshot metadata record.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotRecord'
        '304':
          description: The supplied `If-None-Match` matches this immutable record.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/snapshots/{id}/content:
    get:
      operationId: getSnapshotContent
      tags: [Snapshots]
      summary: Download the exact bytes of one snapshot
      description: |
        Returns the exact uncompressed content addressed by the record's hash. The
        `ETag` is the quoted `sha256:<hex>` revision, so a client can compare it with the
        record. `Range` uses an inclusive start and an exclusive end, matching the file
        content route. Deletion and directory markers have no content and return `404`
        with `snapshots.not-found`.

        This route can expose secrets captured from configuration files. It requires
        authentication and, once RBAC arrives, `snapshots.read` on the record's path
        scope. The response never includes a host path or an internal blob name.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
        - name: Range
          in: header
          required: false
          description: Inclusive start and exclusive end, for example `bytes=0-1023`.
          schema:
            type: string
            pattern: '^bytes=\d*-\d*$'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The complete snapshot bytes.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Accept-Ranges:
              description: Always `bytes`.
              schema:
                type: string
                const: bytes
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: The requested byte range.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Content-Range:
              description: Range and total size, for example `bytes 0-1023/2048`.
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: The supplied `If-None-Match` matches the snapshot revision.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/snapshots/diff:
    get:
      operationId: diffSnapshots
      tags: [Snapshots]
      summary: Compare two snapshots
      description: |
        Compares two immutable snapshots with the bounded `core.diff` engine. `mode=auto`
        selects line, semantic YAML/JSON, or JAR metadata comparison from the record
        kinds; an explicit mode overrides detection. Both ids must exist in the same
        store and pass the caller's path-scope check once RBAC arrives.

        `diff.invalid-input` maps to `400` and `diff.too-large` maps to `413`. A successful
        response has status `identical` or `changed`, and never embeds a host path. Diff
        text can expose configuration secrets and is therefore authenticated.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      parameters:
        - name: a
          in: query
          required: true
          description: Snapshot id used as the before side.
          schema:
            $ref: '#/components/schemas/SnapshotId'
        - name: b
          in: query
          required: true
          description: Snapshot id used as the after side.
          schema:
            $ref: '#/components/schemas/SnapshotId'
        - name: mode
          in: query
          required: false
          description: Input interpretation; `auto` feature-detects from the recorded kind.
          schema:
            type: string
            enum: [auto, text, yaml, json, jar]
            default: auto
      responses:
        '200':
          description: A bounded diff result.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotDiff'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/snapshots/{id}/restore:
    post:
      operationId: restoreSnapshot
      tags: [Snapshots]
      summary: Restore one snapshot to its recorded path
      description: |
        Restores the selected snapshot to the exact sandbox-relative path recorded in its
        metadata. Clients cannot choose a different target. The server derives the actor
        from the authenticated identity; no request body can spoof it.

        Restore is reversible: the current target state is captured with reason `restore`
        before mutation, including a deletion marker when the target is missing. When the
        target exists, `If-Match` must contain its current revision; a missing precondition
        is `428` and a stale revision is `412` with `snapshots.restore-conflict`. When the
        target is absent, the server pins absence under its store lock so a concurrent
        creation also produces `412`. Restore of a deletion marker removes only the
        recorded target after that capture. An id that names a directory marker is rejected
        as `snapshots.corrupt`.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The restored id and the new pre-restore snapshot id.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/snapshots/prune:
    post:
      operationId: pruneSnapshots
      tags: [Snapshots]
      summary: Prune snapshots for one path or one id
      description: |
        Applies host retention rules to exactly one target: either a sandbox-relative
        `path` or an opaque snapshot `id`, never both. Protected records stay: the newest
        three versions of every path, records referenced by a non-terminal deployment,
        and records younger than the configured minimum age.

        Prune removes metadata and per-path index entries only. Blobs remain until a host
        garbage-collection pass, so a recent prune can still be repaired. This route never
        starts GC, changes other paths, or exposes store-relative file names.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PruneRequest'
      responses:
        '200':
          description: Counts from the prune run.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    cloudflareAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: |
        Cloudflare Access JWT. Used in `cloudflare` authentication mode.

        The plain `Cf-Access-Authenticated-User-Email` header is never trusted.
        The JWT signature, `iss`, `aud`, `exp`, `nbf`, and `iat` are verified against
        the configured team JWKS with an algorithm allow-list. Verification failure
        is a `401`, never a fallback to another identity source.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: DeployMC API token
      description: |
        Host-provisioned DeployMC API token, sent as `Authorization: Bearer <token>`.
        Used in `token` authentication mode; current implementation state is tracked
        in `docs/development/implementation-status.md`.

        Tokens are high-entropy, shown once by `/deploymc token create`, and stored
        only as a SHA-256 hash under `plugins/DeployMC/tokens.d`. Expiry, revocation,
        and last-used tracking are part of the WP-3.3 contract. `scopes` narrow the
        effective permissions of the token's `owner` and can never grant more. An absent
        owner uses `default-role`. The separate `local-onetime` mode prints one
        short-lived console token and never persists it.
    sessionCookie:
      type: apiKey
      in: cookie
      name: deploymc_session
      description: |
        Reserved for a possible cookie-based browser session. If used, the cookie is
        `HttpOnly`, `SameSite`, `Secure` when applicable, rotated, and combined with
        CSRF protection for state-changing requests. Not enabled by this skeleton.

  headers:
    ETag:
      description: |
        Opaque revision identifier for the representation. Clients send it in
        `If-Match` for writes and `If-None-Match` for conditional reads. The exact
        format is an implementation detail; the current design uses a quoted
        `"sha256:<lowercase hex>"` file revision and a derived value for aggregate
        resources.
      schema:
        type: string
        pattern: '^"[^"]+"$|^W/"([^"]+)"$'
    RequestId:
      description: Correlation id assigned by the transport. Always present on API responses.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    RateLimitLimit:
      description: Request quota for the current window.
      schema:
        type: integer
        minimum: 0
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Seconds until the current window resets.
      schema:
        type: integer
        minimum: 0
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
    Location:
      description: Absolute or root-relative URL of a created or moved resource.
      schema:
        type: string
        format: uri-reference

  parameters:
    SandboxPath:
      name: path
      in: query
      required: true
      description: |
        Sandbox-relative path. An empty value means the sandbox root. Absolute host
        paths, backslashes, repeated slashes, and `..` segments are rejected by the
        resolver before any file-system access. Protected paths are never read or
        written.
      schema:
        type: string
        maxLength: 1024
        pattern: '^(?!/)(?!.*\\)(?!.*//)(?!\.\.(?:/|$))(?!.*/\.\.(?:/|$)).*$'
    SnapshotId:
      name: id
      in: path
      required: true
      description: |
        Opaque snapshot id. An unknown or syntactically invalid id is reported as
        `snapshots.not-found` without distinguishing the two cases.
      schema:
        $ref: '#/components/schemas/SnapshotId'
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque pagination cursor returned as `nextCursor` by a previous request.
        Clients must not parse or construct cursors. An invalid cursor is a
        `request.invalid-cursor` error.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: |
        Maximum number of items to return. The server clamps values above its
        documented maximum instead of rejecting them.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Required when the operation targets an existing file or replaces an existing
        destination; optional when it creates a missing file. A missing precondition on an
        existing target is `428` with `request.precondition-required`. A stale value
        returns `412` with the current revision, never a silent overwrite.
      schema:
        type: string
        minLength: 1
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Returns `304` when the supplied revision matches the current one.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated key that makes a create operation safe to retry. Repeating
        the same key with the same payload returns the original result. Reusing a key
        with a different payload is a conflict.
      schema:
        type: string
        minLength: 8
        maxLength: 255

  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is required or the supplied credential is invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        WWW-Authenticate:
          description: Authentication challenge. Omitted when disclosure would help an attacker.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The identity is authenticated but not allowed to perform this action.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is not visible to this identity.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with the current state.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: The supplied revision does not match the current revision.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: |
        The request body, file, upload, listing, deletion, or validation input exceeds a
        host-controlled limit. The `code` distinguishes `request.too-large`,
        `files.too-large`, `files.delete-limit-exceeded`, and
        `validation.limit-exceeded`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The `Content-Type` is not supported for this operation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RangeNotSatisfiable:
      description: The requested byte range is malformed or lies outside the file.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Content-Range:
          description: Unsatisfied range with the complete file size, for example `bytes */2048`.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: |
        The request is syntactically valid but the content was rejected. Validation
        findings use `validation.failed` and carry one `errors[]` entry per finding.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: A destructive write omitted the required `If-Match` precondition.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: A rate limit was exceeded.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: An unexpected server error. Details are not disclosed in the response.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: The server is not ready, is shutting down, or is overloaded.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
      examples:
        - status: ok

    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, starting, not-ready, shutting-down]
        checks:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/ReadinessCheck'
      examples:
        - status: ready
          checks:
            - name: configuration
              status: pass
            - name: data-lock
              status: pass
            - name: snapshot-store
              status: pass
            - name: authentication
              status: pass
            - name: transport
              status: pass

    ReadinessCheck:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,63}$'
        status:
          type: string
          enum: [pass, fail, skipped]
        detail:
          type: string
          maxLength: 512
          description: Non-sensitive explanation. Never contains configuration values or secrets.

    PlatformInfo:
      type: object
      additionalProperties: false
      required: [softwareName, softwareVersion, minecraftVersion, javaVersion, operatingSystem]
      properties:
        softwareName:
          type: string
          minLength: 1
          maxLength: 64
          examples: [Paper, Folia, Spigot, Velocity, BungeeCord, Standalone]
        softwareVersion:
          type: string
          minLength: 1
          maxLength: 128
          examples: ['1.21.4']
        minecraftVersion:
          type: string
          minLength: 1
          maxLength: 64
          examples: ['1.21.4']
        javaVersion:
          type: string
          minLength: 1
          maxLength: 64
          examples: ['21.0.5']
        operatingSystem:
          type: string
          minLength: 1
          maxLength: 128
          examples: [Linux, Windows 11]

    CapabilityState:
      type: string
      enum: [AVAILABLE, UNAVAILABLE, UNKNOWN]
      description: |
        State of a platform capability. `UNKNOWN` must be treated as unavailable for
        safety-sensitive operations. A missing map key means `UNKNOWN`.

    Capabilities:
      type: object
      description: |
        Capability states for the current runtime. Keys are stable strings defined by
        `CapabilityKeys`; clients must ignore unknown keys and must not invent keys.
      propertyNames:
        # Capability keys are dotted where they form a namespace (log.capture) but
        # a few stable keys are a single hyphenated name (update-folder).
        pattern: '^[a-z][a-z0-9]*(?:-[a-z0-9]+)*(?:\.[a-z][a-z0-9]*(?:-[a-z0-9]+)*)*$'
      additionalProperties:
        $ref: '#/components/schemas/CapabilityState'
      examples:
        - log.capture: AVAILABLE
          log.capture.structured: AVAILABLE
          command.dispatch: AVAILABLE
          command.output: UNKNOWN
          server.save: AVAILABLE
          server.shutdown: AVAILABLE
          server.restart.script: UNAVAILABLE
          plugins.enumerate: AVAILABLE
          plugins.enable-state: AVAILABLE
          plugins.load-errors: UNKNOWN
          update-folder: AVAILABLE
          scheduler.region: UNAVAILABLE
          players.locale: AVAILABLE
          players.broadcast: AVAILABLE

    ServerInfo:
      type: object
      additionalProperties: false
      required: [deployMcVersion, apiVersion, platform, capabilities]
      properties:
        deployMcVersion:
          type: string
          pattern: '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$'
          examples: ['0.1.0']
        apiVersion:
          type: string
          pattern: '^v[0-9]+$'
          examples: [v1]
        platform:
          $ref: '#/components/schemas/PlatformInfo'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
      examples:
        - deployMcVersion: 0.1.0
          apiVersion: v1
          platform:
            softwareName: Paper
            softwareVersion: '1.21.4'
            minecraftVersion: '1.21.4'
            javaVersion: '21.0.5'
            operatingSystem: Linux
          capabilities:
            log.capture: AVAILABLE
            log.capture.structured: AVAILABLE
            command.dispatch: AVAILABLE
            server.restart.script: UNAVAILABLE
            scheduler.region: UNAVAILABLE
            update-folder: AVAILABLE

    DoctorStatus:
      type: string
      enum: [PASS, WARN, FAIL]
      description: |
        Result of one doctor check. `PASS` requires a product implementation that verified the
        condition. Unimplemented checks are always `WARN`.

    DoctorCheck:
      type: object
      additionalProperties: false
      required: [id, status, implemented, detail]
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9]*(?:\.[a-z][a-z0-9-]+)*$'
          examples: [sandbox, auth.tunnel]
        status:
          $ref: '#/components/schemas/DoctorStatus'
        implemented:
          type: boolean
          description: Whether product code verified this check.
        detail:
          type: string
          maxLength: 512
          description: Localized non-sensitive explanation.
        remediation:
          type: string
          maxLength: 512
          description: Localized non-sensitive remediation hint.
        evidence:
          type: object
          maxProperties: 16
          additionalProperties:
            oneOf:
              - type: string
                maxLength: 256
              - type: integer
              - type: boolean
          description: Allow-listed scalar evidence. Never contains paths, secrets, or identities.

    PermissionIdentifier:
      type: string
      enum:
        - server.read
        - files.read
        - files.write
        - files.delete
        - files.upload
        - snapshots.read
        - snapshots.restore
        - snapshots.prune
        - deployments.read
        - deployments.create
        - deployments.create.jar
        - deployments.approve
        - deployments.cancel
        - deployments.rollback
        - server.restart
        - console.read
        - console.command
        - audit.read
        - audit.export
        - tokens.manage.self
        - tokens.manage.all
        - webhooks.manage
        - users.read
      description: Closed WP-3.4 permission registry; `*` is expanded and never returned.

    MeIdentity:
      type: object
      additionalProperties: false
      required: [id, kind]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 320
          description: Opaque verified identity id belonging to the caller only.
        kind:
          type: string
          enum: [cloudflare, token, local-onetime]

    ExplainResult:
      type: object
      additionalProperties: false
      required: [permission, decision, reason, path, roles]
      properties:
        permission:
          $ref: '#/components/schemas/PermissionIdentifier'
        decision:
          type: string
          enum: [allow, deny]
        reason:
          type: [string, 'null']
          enum: [NO_ROLE, NOT_GRANTED, TOKEN_SCOPE_EXCEEDED, PATH_DENIED, PATH_SCOPE, null]
          description: Stable denial reason; `null` when `decision` is `allow`.
        path:
          type: object
          additionalProperties: false
          required: [requested, resolved, withinScope]
          properties:
            requested:
              type: boolean
            resolved:
              type: boolean
            withinScope:
              type: boolean
          description: Booleans only; no raw path or glob is returned.
        token:
          type: object
          additionalProperties: false
          required: [present, containsPermission]
          properties:
            present:
              type: boolean
            containsPermission:
              type: boolean
          description: Present only for token identities; no raw scope string is returned.
        roles:
          type: object
          additionalProperties: false
          required: [assigned, granting, denyRuleMatches, allowRuleMatches]
          properties:
            assigned:
              type: integer
              minimum: 0
            granting:
              type: integer
              minimum: 0
            denyRuleMatches:
              type: integer
              minimum: 0
            allowRuleMatches:
              type: integer
              minimum: 0
          description: Bounded counts; no role names beyond the caller's own role list.

    MeResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, identity, roles, permissions]
      properties:
        schemaVersion:
          type: string
          const: '1.0'
        identity:
          $ref: '#/components/schemas/MeIdentity'
        roles:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: Sorted roles assigned to the caller.
        permissions:
          type: array
          maxItems: 23
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionIdentifier'
          description: Effective permissions after token narrowing, in canonical registry order.
        explain:
          $ref: '#/components/schemas/ExplainResult'

    DoctorReport:
      type: object
      additionalProperties: false
      required: [schemaVersion, generatedAt, overall, scope, checks]
      properties:
        schemaVersion:
          type: string
          const: '1.0'
        generatedAt:
          type: string
          format: date-time
          description: ISO-8601 UTC instant supplied by an injectable clock.
        overall:
          $ref: '#/components/schemas/DoctorStatus'
        scope:
          type: string
          const: limited
          description: The doctor baseline does not constitute a support-tier verdict.
        checks:
          type: array
          minItems: 15
          maxItems: 64
          items:
            $ref: '#/components/schemas/DoctorCheck'
        redacted:
          type: boolean
          description: True when host-specific evidence was removed for copy-paste.

    Problem:
      type: object
      description: |
        RFC 9457 Problem Details with DeployMC extensions. `code` is stable and is the
        only field clients may branch on. `title` and `detail` are localized prose.
      additionalProperties: true
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
          description: |
            URI reference identifying the problem type. DeployMC uses
            `urn:deploymc:error:<code>`; `about:blank` is allowed when no specific
            type exists.
          examples: ['urn:deploymc:error:auth.required']
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 2000
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9-]*)+$'
          description: |
            Stable, machine-readable error code. Never localized and never reused for
            a different meaning. The initial catalog is `specification/api/errors.md`.
          examples: [auth.required, files.revision-conflict]
        requestId:
          type: string
          minLength: 8
          maxLength: 128
        retryable:
          type: boolean
          default: false
          description: Whether retrying the same request later may succeed.
        errors:
          type: array
          maxItems: 200
          description: |
            Field- or path-level validation problems, bounded by the host `maxIssues`
            budget (default 200).
          items:
            $ref: '#/components/schemas/ProblemIssue'
      examples:
        - type: urn:deploymc:error:files.revision-conflict
          title: Revision conflict
          status: 412
          detail: The file changed since the supplied revision.
          code: files.revision-conflict
          requestId: 01J00000000000000000000000
          retryable: false
          errors:
            - pointer: /path
              code: files.revision-mismatch
              detail: Expected sha256:a1b2..., found sha256:c3d4...

    ProblemIssue:
      type: object
      additionalProperties: false
      required: [pointer, code]
      properties:
        pointer:
          type: string
          maxLength: 1024
          description: |
            Location of the problem. For JSON bodies this is a JSON Pointer; for files
            it is a sandbox-relative path. It never contains an absolute host path.
        code:
          type: string
          pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9-]*)+$'
        detail:
          type: string
          maxLength: 1000
        severity:
          type: string
          enum: [ERROR, WARNING]
          description: Present on content-validation findings.
        line:
          type: integer
          minimum: 0
          description: 1-based decoded line, or 0 when unavailable. Validation findings only.
        column:
          type: integer
          minimum: 0
          description: 1-based decoded column, or 0 when unavailable. Validation findings only.
        offset:
          type: integer
          minimum: -1
          description: 0-based byte offset, or -1 when unavailable. Validation findings only.
        parameters:
          type: array
          maxItems: 8
          description: |
            Safe values used only for localized message formatting. Never raw content,
            credentials, tokens, or absolute host paths.
          items:
            type: string
            maxLength: 256

    Page:
      type: object
      description: |
        Cursor-paginated list envelope. Concrete list operations will replace the
        free-form `items` schema with a typed item; the pagination fields are stable.
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: [string, 'null']
          maxLength: 512
          description: Cursor for the next page, or `null` on the last page.
        total:
          type: integer
          minimum: 0
          description: Optional exact count. Omitted when counting would be unbounded.

    FileEntry:
      type: object
      additionalProperties: false
      required: [path, kind, size, revision, lastModified]
      properties:
        path:
          type: string
          maxLength: 1024
          description: Sandbox-relative path. Never an absolute host path.
        kind:
          type: string
          enum: [file, directory]
        size:
          type: integer
          minimum: 0
          description: File size in bytes; `0` for a directory.
        revision:
          type: [string, 'null']
          pattern: '^sha256:[0-9a-f]{64}$'
          description: |
            Full-file revision used as the `ETag` source. `null` for a directory.
        lastModified:
          type: string
          format: date-time
          description: Last modification time in UTC.

    FileList:
      type: object
      additionalProperties: false
      required: [path, items, nextCursor]
      properties:
        path:
          type: string
          maxLength: 1024
          description: Sandbox-relative path of the listed directory; empty means the root.
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/FileEntry'
        nextCursor:
          type: [string, 'null']
          maxLength: 512
          description: Opaque cursor for the next page, or `null` on the last page.
        total:
          type: integer
          minimum: 0
          description: Optional exact count. Omitted when counting would be unbounded.

    FileWriteResult:
      type: object
      additionalProperties: false
      required: [entry, validation]
      properties:
        entry:
          $ref: '#/components/schemas/FileEntry'
        validation:
          description: |
            Host-gate result for the committed bytes, or `null` when no validation gate is
            configured. Warnings never block a write.
          oneOf:
            - $ref: '#/components/schemas/ValidationResponse'
            - type: 'null'

    CreateEntryRequest:
      type: object
      additionalProperties: false
      required: [path, kind]
      properties:
        path:
          type: string
          maxLength: 1024
          description: Sandbox-relative path of the new entry. The sandbox root is rejected.
        kind:
          type: string
          enum: [file, directory]
        content:
          type: string
          description: |
            UTF-8 text content. Required for `file` and forbidden for `directory`.
            Binary content uses `POST /api/v1/files/upload`.
      if:
        properties:
          kind:
            const: file
      then:
        required: [content]
        properties:
          content:
            type: string
      else:
        properties:
          content: false

    MoveRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          maxLength: 1024
          description: Existing sandbox-relative source path. The sandbox root is rejected.
        to:
          type: string
          maxLength: 1024
          description: Sandbox-relative destination path. The sandbox root is rejected.
        overwrite:
          type: boolean
          default: false
          description: Replace an existing destination. A file source still needs `If-Match`.

    ValidateRequest:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path:
          type: string
          maxLength: 1024
          description: |
            Sandbox-relative path used only to select a validator. The path is resolved
            through the sandbox before any validator runs, and no file is written.
        content:
          type: string
          description: |
            UTF-8 text to validate. The server encodes it as UTF-8 bytes. Byte-exact
            validation of non-UTF-8 content happens through a write or upload request.

    ValidationResponse:
      type: object
      additionalProperties: false
      required: [path, matched, format, valid, issues]
      properties:
        path:
          type: string
          maxLength: 1024
          description: Sandbox-relative path that was validated.
        matched:
          type: boolean
          description: |
            `false` when no validator matches the path. An unmatched result must never be
            presented as validated.
        format:
          type: [string, 'null']
          enum: [yaml, json, toml, properties, null]
          description: Validator id, or `null` when unmatched.
        valid:
          type: boolean
          description: '`false` when at least one ERROR finding exists. Warnings do not block.'
        issues:
          type: array
          maxItems: 200
          description: Bounded by the host `maxIssues` budget (default 200).
          items:
            $ref: '#/components/schemas/ValidationFinding'

    ValidationFinding:
      type: object
      additionalProperties: false
      required: [severity, code, pointer, line, column, offset, detail]
      properties:
        severity:
          type: string
          enum: [ERROR, WARNING]
        code:
          type: string
          pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9-]*)+$'
          description: Stable issue code from the error catalog. Never localized.
        pointer:
          type: string
          maxLength: 1024
          description: |
            Empty for the whole document; otherwise an RFC 6901 JSON Pointer into the
            document. Never an absolute host path.
        line:
          type: integer
          minimum: 0
          description: 1-based decoded line, or 0 when unavailable.
        column:
          type: integer
          minimum: 0
          description: 1-based decoded column, or 0 when unavailable.
        offset:
          type: integer
          minimum: -1
          description: 0-based raw byte offset, or -1 when unavailable.
        detail:
          type: string
          maxLength: 1000
          description: Localized explanation negotiated through `Accept-Language`.
        parameters:
          type: array
          maxItems: 8
          description: Safe values used only for localized message formatting.
          items:
            type: string
            maxLength: 256

    SnapshotId:
      type: string
      minLength: 31
      maxLength: 31
      pattern: '^snap_[0-9a-z]{26}$'
      description: Opaque snapshot id. It is never derived from a host path.

    SnapshotRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - capture
        - path
        - kind
        - hash
        - size
        - mode
        - createdAt
        - actor
        - reason
        - deploymentId
        - parent
        - pluginMetadata
      properties:
        id:
          $ref: '#/components/schemas/SnapshotId'
        capture:
          type: string
          minLength: 1
          maxLength: 128
          description: Id shared by every record captured by one request.
        path:
          type: string
          maxLength: 1024
          description: Normalized sandbox-relative path. Never an absolute host path.
        kind:
          type: string
          enum: [file, jar, deleted, directory]
        hash:
          type: [string, 'null']
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Full content revision, or `null` for deletion and directory markers.
        size:
          type: integer
          minimum: 0
          description: Exact byte length, or `0` for a non-content marker.
        mode:
          type: [string, 'null']
          pattern: '^[0-7]{4}$'
          description: POSIX mode as four octal digits when available.
        createdAt:
          type: string
          format: date-time
          description: UTC RFC 3339 instant with an explicit `Z`.
        actor:
          type: string
          minLength: 1
          maxLength: 256
          description: Host-derived authenticated actor id, never a request-supplied value.
        reason:
          type: string
          enum: [edit, delete, rename, deploy, restore]
        deploymentId:
          type: [string, 'null']
          maxLength: 128
          description: Owning deployment id when applicable.
        parent:
          type: [string, 'null']
          description: Previous snapshot id for the same path, or `null`.
        pluginMetadata:
          type: [object, 'null']
          additionalProperties: false
          description: Descriptor summary for JAR snapshots, or `null`.
          properties:
            name:
              type: string
              maxLength: 512
            version:
              type: string
              maxLength: 256
            descriptor-summary:
              type: string
              maxLength: 4096

    SnapshotList:
      type: object
      additionalProperties: false
      required: [path, items, nextCursor]
      properties:
        path:
          type: string
          maxLength: 1024
          description: Sandbox-relative path whose history was listed.
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/SnapshotRecord'
        nextCursor:
          type: [string, 'null']
          maxLength: 512
          description: Opaque cursor for the next page, or `null` on the last page.
        total:
          type: integer
          minimum: 0
          description: Exact count of records for this path.

    RestoreResult:
      type: object
      additionalProperties: false
      required: [restoredSnapshotId, preRestoreSnapshotId]
      properties:
        restoredSnapshotId:
          $ref: '#/components/schemas/SnapshotId'
        preRestoreSnapshotId:
          $ref: '#/components/schemas/SnapshotId'
          description: New reversible snapshot of the target's previous state.

    PruneRequest:
      type: object
      additionalProperties: false
      description: Exactly one of `path` or `id` is required.
      oneOf:
        - required: [path]
        - required: [id]
      properties:
        path:
          type: string
          maxLength: 1024
          description: Sandbox-relative path whose eligible snapshots may be pruned.
        id:
          $ref: '#/components/schemas/SnapshotId'

    RetentionReport:
      type: object
      additionalProperties: false
      required:
        - considered
        - protectedRecords
        - pruned
        - failed
        - storeBytesBefore
        - storeBytesAfter
      properties:
        considered:
          type: integer
          minimum: 0
        protectedRecords:
          type: integer
          minimum: 0
          description: Records kept by the newest-three, deployment, or age invariants.
        pruned:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        storeBytesBefore:
          type: integer
          minimum: 0
        storeBytesAfter:
          type: integer
          minimum: 0
          description: Blobs remain after prune; this reports only current store bytes.

    DiffContentInfo:
      type: object
      additionalProperties: false
      required: [size, sha256]
      properties:
        size:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'

    DiffLineChange:
      type: object
      additionalProperties: false
      required: [kind, oldLine, newLine, text, ending]
      properties:
        kind:
          type: string
          enum: [context, removed, added]
        oldLine:
          type: [integer, 'null']
          minimum: 1
        newLine:
          type: [integer, 'null']
          minimum: 1
        text:
          type: string
          maxLength: 1048576
          description: Decoded line text without its terminator.
        ending:
          type: string
          enum: [LF, CRLF, CR, EOF]

    DiffLineHunk:
      type: object
      additionalProperties: false
      required: [oldStart, oldLines, newStart, newLines, lines]
      properties:
        oldStart:
          type: integer
          minimum: 1
        oldLines:
          type: integer
          minimum: 0
        newStart:
          type: integer
          minimum: 1
        newLines:
          type: integer
          minimum: 0
        lines:
          type: array
          maxItems: 4096
          items:
            $ref: '#/components/schemas/DiffLineChange'

    DiffWordSegment:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [unchanged, removed, added]
        text:
          type: string
          maxLength: 1048576

    DiffWordDiff:
      type: object
      additionalProperties: false
      required: [oldLine, newLine, oldSegments, newSegments]
      properties:
        oldLine:
          type: integer
          minimum: 1
        newLine:
          type: integer
          minimum: 1
        oldSegments:
          type: array
          maxItems: 4096
          items:
            $ref: '#/components/schemas/DiffWordSegment'
        newSegments:
          type: array
          maxItems: 4096
          items:
            $ref: '#/components/schemas/DiffWordSegment'

    DiffSemanticChange:
      type: object
      additionalProperties: false
      required: [kind, path, before, beforeType, after, afterType, from, to, value, valueType, beforeOrder, afterOrder]
      description: |
        Optional fields are `null` when they do not apply to the change kind. Values are
        bounded scalar representations, not raw structured content.
      properties:
        kind:
          type: string
          enum: [added, removed, changed, renamed, reordered]
        path:
          type: [string, 'null']
          maxLength: 1024
        before:
          type: [string, 'null']
          maxLength: 4096
        beforeType:
          type: [string, 'null']
          maxLength: 64
        after:
          type: [string, 'null']
          maxLength: 4096
        afterType:
          type: [string, 'null']
          maxLength: 64
        from:
          type: [string, 'null']
          maxLength: 1024
        to:
          type: [string, 'null']
          maxLength: 1024
        value:
          type: [string, 'null']
          maxLength: 4096
        valueType:
          type: [string, 'null']
          maxLength: 64
        beforeOrder:
          type: [array, 'null']
          maxItems: 1024
          items:
            type: string
            maxLength: 1024
        afterOrder:
          type: [array, 'null']
          maxItems: 1024
          items:
            type: string
            maxLength: 1024

    DiffJarDependencyChange:
      type: object
      additionalProperties: false
      required: [name, kind, scope]
      properties:
        name:
          type: string
          maxLength: 1024
        kind:
          type: string
          enum: [added, removed, scope-changed]
        scope:
          type: string
          maxLength: 128

    DiffJarDescriptor:
      type: object
      additionalProperties: false
      required: [name, status, fieldChanges, dependencyChanges]
      properties:
        name:
          type: string
          maxLength: 512
        status:
          type: string
          maxLength: 64
        fieldChanges:
          type: array
          maxItems: 512
          items:
            $ref: '#/components/schemas/DiffSemanticChange'
        dependencyChanges:
          type: array
          maxItems: 1024
          items:
            $ref: '#/components/schemas/DiffJarDependencyChange'

    DiffJarMetadata:
      type: object
      additionalProperties: false
      required: [hashChanged, sizeDelta, entriesAdded, entriesRemoved, descriptors]
      properties:
        hashChanged:
          type: boolean
        sizeDelta:
          type: integer
        entriesAdded:
          type: array
          maxItems: 4096
          items:
            type: string
            maxLength: 1024
        entriesRemoved:
          type: array
          maxItems: 4096
          items:
            type: string
            maxLength: 1024
        descriptors:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/DiffJarDescriptor'

    SnapshotDiff:
      type: object
      additionalProperties: false
      required:
        - a
        - b
        - status
        - strategy
        - before
        - after
        - notes
        - lineHunks
        - wordDiffs
        - semanticChanges
        - jarMetadata
      properties:
        a:
          $ref: '#/components/schemas/SnapshotId'
        b:
          $ref: '#/components/schemas/SnapshotId'
        status:
          type: string
          enum: [identical, changed]
        strategy:
          type: string
          enum: [none, line, semantic, text-fallback, jar-metadata]
        before:
          $ref: '#/components/schemas/DiffContentInfo'
        after:
          $ref: '#/components/schemas/DiffContentInfo'
        notes:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 512
        lineHunks:
          type: array
          maxItems: 4096
          items:
            $ref: '#/components/schemas/DiffLineHunk'
        wordDiffs:
          type: array
          maxItems: 4096
          items:
            $ref: '#/components/schemas/DiffWordDiff'
        semanticChanges:
          type: array
          maxItems: 4096
          items:
            $ref: '#/components/schemas/DiffSemanticChange'
        jarMetadata:
          oneOf:
            - $ref: '#/components/schemas/DiffJarMetadata'
            - type: 'null'
