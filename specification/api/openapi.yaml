openapi: 3.1.0

info:
  title: DeployMC API
  version: 0.1.0
  summary: Authenticated REST API for DeployMC.
  description: |
    Normative REST contract for DeployMC. The API is served by the DeployMC plugin,
    binds to `127.0.0.1` by default, and is authenticated by host-provisioned bearer
    tokens in 0.1.0. Remote access requires a TLS terminator.

    **Status: partial.** The authentication gate, health endpoints, the
    `GET /api/v1/server` application handler, and the WP-2.6 file and validation transport
    adapters are implemented. The adapters have server-free contract tests, but no
    running-server smoke test or Web UI consumes them yet. Until 0.4.0 every valid token
    is admin-equivalent; role and path scoping arrive with RBAC. The remaining server
    resource fields and the snapshot, deployment, console, and audit resources are defined
    for later work packages.

    Rules that apply to every operation:

    - There is no unauthenticated endpoint except `/healthz` and `/readyz`.
    - Errors use RFC 9457 Problem Details with a stable machine-readable `code`.
    - Human-readable `title` and `detail` are localized through `Accept-Language`
      and are never used for program logic.
    - Existing resources use `ETag`/`If-Match`. A missing precondition on a
      destructive write is an error, not a blind overwrite.
    - List resources use cursor pagination with a documented limit.
    - Requests and responses carry a request id for correlation.
    - Breaking changes require a new major API version. Additive changes are
      allowed within `v1`.

    The specification is the source of truth. Behavior changes start here, then in
    the server, clients, and contract tests.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
  contact:
    name: DeployMC maintainers
    url: https://github.com/woxlo1/DeployMC

x-deploymc-implementation-status: partial

servers:
  - url: http://127.0.0.1:8080
    description: |
      Default loopback bind. Binding to another interface requires an explicit
      configuration change and emits a startup warning. TLS is normally terminated
      at Cloudflare; local TLS is optional and not part of this skeleton.

tags:
  - name: Health
    description: Unauthenticated liveness and readiness probes. They reveal no sensitive data.
  - name: Server
    description: Information about the running DeployMC and Minecraft server.
  - name: Files
    description: Sandboxed file listing, reading, writing, moving, upload, and deletion.
  - name: Validation
    description: Server-authoritative content validation for sandbox paths.

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Liveness probe
      description: |
        Returns `200` when the plugin process is alive and its internal lifecycle has
        started. It does not prove that the transport, data directory, or platform
        adapter are ready. No authentication and no sensitive fields.
      security: []
      responses:
        '200':
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /readyz:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Readiness probe
      description: |
        Returns `200` only after configuration validation, data-lock acquisition,
        snapshot-store recovery, authentication initialization, and transport bind
        have completed. Returns `503` with per-check results while starting, after a
        fatal initialization error, or while shutting down.

        No authentication and no sensitive fields; checks report status, not
        configuration values.
      security: []
      responses:
        '200':
          description: The instance is ready to serve API requests.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: The instance is not ready. The body lists the failing checks.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'

  /api/v1/server:
    get:
      operationId: getServer
      tags: [Server]
      summary: Get server and DeployMC information
      description: |
        Returns the DeployMC version, API version, detected platform information, and
        the capability map for the current runtime.

        A capability key that is absent from the map has the state `UNKNOWN`. Clients
        must treat `UNKNOWN` as unavailable for safety-sensitive operations and must
        degrade visibly instead of claiming success.

        The response is derived from immutable value objects and is safe to cache
        within the lifetime of one server process. The `ETag` changes when the
        capability map or platform information changes.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      responses:
        '200':
          description: Current server information.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '304':
          description: The supplied `If-None-Match` matches the current representation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/files:
    get:
      operationId: listFiles
      tags: [Files]
      summary: List directory entries
      description: |
        Lists one sandbox directory. The path is resolved through the sandbox before any
        file-system access. Entries rejected by the resolver are omitted, never revealed.
        Ordering is deterministic by sandbox-relative path. A listing that exceeds the
        host entry cap is paginated with an opaque cursor.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SandboxPath'
        - name: depth
          in: query
          required: false
          description: Maximum directory depth to include. `1` lists direct children.
          schema:
            type: integer
            minimum: 1
            maximum: 64
            default: 1
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of entries in deterministic path order.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createFileEntry
      tags: [Files]
      summary: Create a file or directory
      description: |
        Creates a new file or directory. An existing target is never replaced; the caller must
        use `PUT /api/v1/files/content` with `If-Match` to overwrite. Text content is submitted
        as a JSON string; binary content uses `POST /api/v1/files/upload`. The configured
        validation gate runs before the file is committed.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntryRequest'
      responses:
        '201':
          description: The entry was created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWriteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteFileEntry
      tags: [Files]
      summary: Delete a file or directory
      description: |
        Deletes one file or an empty directory. Recursive deletion requires `recursive=true`
        and an `expectedEntryCount` that matches the current tree size, including the root.
        A file delete requires `If-Match` with the current revision. The sandbox root
        cannot be deleted (`files.invalid-operation`). The configured snapshot hook
        captures the target before deletion; a missing hook fails closed.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SandboxPath'
        - name: recursive
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: expectedEntryCount
          in: query
          required: false
          description: Required when `recursive=true`; must match the current tree size.
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The entry was deleted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/files/content:
    get:
      operationId: readFileContent
      tags: [Files]
      summary: Read file content
      description: |
        Returns the complete file or a byte range. The `ETag` is the full-file revision
        (`sha256:<lowercase hex>`), so a stale `If-Match` is detected even for a range read.
        Binary content is returned as bytes, never as a JSON string.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SandboxPath'
        - name: Range
          in: header
          required: false
          description: Inclusive start and exclusive end, for example `bytes=0-1023`.
          schema:
            type: string
            pattern: '^bytes=\d*-\d*$'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The complete file content.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Accept-Ranges:
              description: Always `bytes`.
              schema:
                type: string
                const: bytes
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: The requested byte range.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Content-Range:
              description: Range and total size, for example `bytes 0-1023/2048`.
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: The supplied `If-None-Match` matches the current revision.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: writeFileContent
      tags: [Files]
      summary: Write file content
      description: |
        Atomically replaces an existing file, or creates a missing one. Replacing an existing
        file requires `If-Match` with the current revision; a missing precondition is
        `request.precondition-required` and a stale one is `files.revision-conflict`. The
        configured validation gate runs before the target is snapshotted and replaced.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SandboxPath'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The existing file was replaced.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWriteResult'
        '201':
          description: A missing file was created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWriteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/files/move:
    post:
      operationId: moveFileEntry
      tags: [Files]
      summary: Move or rename an entry
      description: |
        Moves a file or directory. Overwriting the destination requires `overwrite=true` and,
        for a file source, `If-Match` with the current source revision. Both source and an
        overwritten destination are snapshotted before the move. Neither endpoint may be
        the sandbox root (`files.invalid-operation`).
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
      responses:
        '200':
          description: The entry was moved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/files/upload:
    post:
      operationId: uploadFileContent
      tags: [Files]
      summary: Upload file content
      description: |
        Streams bytes into a same-directory temporary file, validates the staged content, then
        commits with one atomic move. The upload maximum is the smaller of the host upload and
        file limits. Replacing an existing file requires `If-Match`. The response reports the
        resulting entry and any non-blocking validation warnings.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SandboxPath'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The existing file was replaced.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWriteResult'
        '201':
          description: A missing file was created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWriteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/files/validate:
    post:
      operationId: validateFileContent
      tags: [Validation]
      summary: Validate content for a sandbox path
      description: |
        Runs the host-configured validator registry against submitted content for a path,
        without writing any file. The path is resolved through the sandbox first. An unmatched
        file type returns `matched=false` and must never be presented as validated. ERROR
        findings return `validation.failed`; a limit returns `validation.limit-exceeded` with a
        format-specific issue code in `errors[]`; an unexpected validator failure returns
        `validation.validator-unavailable`.
      security:
        - cloudflareAccess: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
      responses:
        '200':
          description: The validation result, including warnings and unmatched types.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    cloudflareAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: |
        Cloudflare Access JWT. Used in `cloudflare` authentication mode.

        The plain `Cf-Access-Authenticated-User-Email` header is never trusted.
        The JWT signature, `iss`, `aud`, `exp`, `nbf`, and `iat` are verified against
        the configured team JWKS with an algorithm allow-list. Verification failure
        is a `401`, never a fallback to another identity source.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: DeployMC API token
      description: |
        Host-provisioned DeployMC API token, sent as `Authorization: Bearer <token>`.
        This is the only implemented authentication mode in 0.1.0.

        Tokens are high-entropy, shown once by `/deploymc token create`, and stored
        only as a SHA-256 hash under `plugins/DeployMC/tokens.d`. Optional expiry is
        enforced. Until 0.4.0 every token is admin-equivalent; permission and path
        scoping arrive with RBAC and are not implemented yet.
    sessionCookie:
      type: apiKey
      in: cookie
      name: deploymc_session
      description: |
        Reserved for a possible cookie-based browser session. If used, the cookie is
        `HttpOnly`, `SameSite`, `Secure` when applicable, rotated, and combined with
        CSRF protection for state-changing requests. Not enabled by this skeleton.

  headers:
    ETag:
      description: |
        Opaque revision identifier for the representation. Clients send it in
        `If-Match` for writes and `If-None-Match` for conditional reads. The exact
        format is an implementation detail; the current design uses a quoted
        `"sha256:<lowercase hex>"` file revision and a derived value for aggregate
        resources.
      schema:
        type: string
        pattern: '^"[^"]+"$|^W/"([^"]+)"$'
    RequestId:
      description: Correlation id assigned by the transport. Always present on API responses.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    RateLimitLimit:
      description: Request quota for the current window.
      schema:
        type: integer
        minimum: 0
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Seconds until the current window resets.
      schema:
        type: integer
        minimum: 0
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
    Location:
      description: Absolute or root-relative URL of a created or moved resource.
      schema:
        type: string
        format: uri-reference

  parameters:
    SandboxPath:
      name: path
      in: query
      required: true
      description: |
        Sandbox-relative path. An empty value means the sandbox root. Absolute host
        paths, backslashes, repeated slashes, and `..` segments are rejected by the
        resolver before any file-system access. Protected paths are never read or
        written.
      schema:
        type: string
        maxLength: 1024
        pattern: '^(?!/)(?!.*\\)(?!.*//)(?!\.\.(?:/|$))(?!.*/\.\.(?:/|$)).*$'
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque pagination cursor returned as `nextCursor` by a previous request.
        Clients must not parse or construct cursors. An invalid cursor is a
        `request.invalid-cursor` error.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: |
        Maximum number of items to return. The server clamps values above its
        documented maximum instead of rejecting them; the effective maximum is
        reported in the response.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Required when the operation targets an existing file or replaces an existing
        destination; optional when it creates a missing file. A missing precondition on an
        existing target is `428` with `request.precondition-required`. A stale value
        returns `412` with the current revision, never a silent overwrite.
      schema:
        type: string
        minLength: 1
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Returns `304` when the supplied revision matches the current one.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated key that makes a create operation safe to retry. Repeating
        the same key with the same payload returns the original result. Reusing a key
        with a different payload is a conflict.
      schema:
        type: string
        minLength: 8
        maxLength: 255

  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is required or the supplied credential is invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        WWW-Authenticate:
          description: Authentication challenge. Omitted when disclosure would help an attacker.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The identity is authenticated but not allowed to perform this action.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is not visible to this identity.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with the current state.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: The supplied revision does not match the current revision.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: |
        The request body, file, upload, listing, deletion, or validation input exceeds a
        host-controlled limit. The `code` distinguishes `request.too-large`,
        `files.too-large`, `files.delete-limit-exceeded`, and
        `validation.limit-exceeded`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The `Content-Type` is not supported for this operation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RangeNotSatisfiable:
      description: The requested byte range is malformed or lies outside the file.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Content-Range:
          description: Unsatisfied range with the complete file size, for example `bytes */2048`.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: |
        The request is syntactically valid but the content was rejected. Validation
        findings use `validation.failed` and carry one `errors[]` entry per finding.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: A destructive write omitted the required `If-Match` precondition.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: A rate limit was exceeded.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: An unexpected server error. Details are not disclosed in the response.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: The server is not ready, is shutting down, or is overloaded.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
      examples:
        - status: ok

    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, starting, not-ready, shutting-down]
        checks:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/ReadinessCheck'
      examples:
        - status: ready
          checks:
            - name: configuration
              status: pass
            - name: data-lock
              status: pass
            - name: snapshot-store
              status: pass
            - name: authentication
              status: pass
            - name: transport
              status: pass

    ReadinessCheck:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,63}$'
        status:
          type: string
          enum: [pass, fail, skipped]
        detail:
          type: string
          maxLength: 512
          description: Non-sensitive explanation. Never contains configuration values or secrets.

    PlatformInfo:
      type: object
      additionalProperties: false
      required: [softwareName, softwareVersion, minecraftVersion, javaVersion, operatingSystem]
      properties:
        softwareName:
          type: string
          minLength: 1
          maxLength: 64
          examples: [Paper, Folia, Spigot, Velocity, BungeeCord, Standalone]
        softwareVersion:
          type: string
          minLength: 1
          maxLength: 128
          examples: ['1.21.4']
        minecraftVersion:
          type: string
          minLength: 1
          maxLength: 64
          examples: ['1.21.4']
        javaVersion:
          type: string
          minLength: 1
          maxLength: 64
          examples: ['21.0.5']
        operatingSystem:
          type: string
          minLength: 1
          maxLength: 128
          examples: [Linux, Windows 11]

    CapabilityState:
      type: string
      enum: [AVAILABLE, UNAVAILABLE, UNKNOWN]
      description: |
        State of a platform capability. `UNKNOWN` must be treated as unavailable for
        safety-sensitive operations. A missing map key means `UNKNOWN`.

    Capabilities:
      type: object
      description: |
        Capability states for the current runtime. Keys are stable strings defined by
        `CapabilityKeys`; clients must ignore unknown keys and must not invent keys.
      propertyNames:
        # Capability keys are dotted where they form a namespace (log.capture) but
        # a few stable keys are a single hyphenated name (update-folder).
        pattern: '^[a-z][a-z0-9]*(?:-[a-z0-9]+)*(?:\.[a-z][a-z0-9]*(?:-[a-z0-9]+)*)*$'
      additionalProperties:
        $ref: '#/components/schemas/CapabilityState'
      examples:
        - log.capture: AVAILABLE
          log.capture.structured: AVAILABLE
          command.dispatch: AVAILABLE
          command.output: UNKNOWN
          server.save: AVAILABLE
          server.shutdown: AVAILABLE
          server.restart.script: UNAVAILABLE
          plugins.enumerate: AVAILABLE
          plugins.enable-state: AVAILABLE
          plugins.load-errors: UNKNOWN
          update-folder: AVAILABLE
          scheduler.region: UNAVAILABLE
          players.locale: AVAILABLE
          players.broadcast: AVAILABLE

    ServerInfo:
      type: object
      additionalProperties: false
      required: [deployMcVersion, apiVersion, platform, capabilities]
      properties:
        deployMcVersion:
          type: string
          pattern: '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$'
          examples: ['0.1.0']
        apiVersion:
          type: string
          pattern: '^v[0-9]+$'
          examples: [v1]
        platform:
          $ref: '#/components/schemas/PlatformInfo'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
      examples:
        - deployMcVersion: 0.1.0
          apiVersion: v1
          platform:
            softwareName: Paper
            softwareVersion: '1.21.4'
            minecraftVersion: '1.21.4'
            javaVersion: '21.0.5'
            operatingSystem: Linux
          capabilities:
            log.capture: AVAILABLE
            log.capture.structured: AVAILABLE
            command.dispatch: AVAILABLE
            server.restart.script: UNAVAILABLE
            scheduler.region: UNAVAILABLE
            update-folder: AVAILABLE

    Problem:
      type: object
      description: |
        RFC 9457 Problem Details with DeployMC extensions. `code` is stable and is the
        only field clients may branch on. `title` and `detail` are localized prose.
      additionalProperties: true
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
          description: |
            URI reference identifying the problem type. DeployMC uses
            `urn:deploymc:error:<code>`; `about:blank` is allowed when no specific
            type exists.
          examples: ['urn:deploymc:error:auth.required']
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 2000
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9-]*)+$'
          description: |
            Stable, machine-readable error code. Never localized and never reused for
            a different meaning. The initial catalog is `specification/api/errors.md`.
          examples: [auth.required, files.revision-conflict]
        requestId:
          type: string
          minLength: 8
          maxLength: 128
        retryable:
          type: boolean
          default: false
          description: Whether retrying the same request later may succeed.
        errors:
          type: array
          maxItems: 200
          description: |
            Field- or path-level validation problems, bounded by the host `maxIssues`
            budget (default 200).
          items:
            $ref: '#/components/schemas/ProblemIssue'
      examples:
        - type: urn:deploymc:error:files.revision-conflict
          title: Revision conflict
          status: 412
          detail: The file changed since the supplied revision.
          code: files.revision-conflict
          requestId: 01J00000000000000000000000
          retryable: false
          errors:
            - pointer: /path
              code: files.revision-mismatch
              detail: Expected sha256:a1b2..., found sha256:c3d4...

    ProblemIssue:
      type: object
      additionalProperties: false
      required: [pointer, code]
      properties:
        pointer:
          type: string
          maxLength: 1024
          description: |
            Location of the problem. For JSON bodies this is a JSON Pointer; for files
            it is a sandbox-relative path. It never contains an absolute host path.
        code:
          type: string
          pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9-]*)+$'
        detail:
          type: string
          maxLength: 1000
        severity:
          type: string
          enum: [ERROR, WARNING]
          description: Present on content-validation findings.
        line:
          type: integer
          minimum: 0
          description: 1-based decoded line, or 0 when unavailable. Validation findings only.
        column:
          type: integer
          minimum: 0
          description: 1-based decoded column, or 0 when unavailable. Validation findings only.
        offset:
          type: integer
          minimum: -1
          description: 0-based byte offset, or -1 when unavailable. Validation findings only.
        parameters:
          type: array
          maxItems: 8
          description: |
            Safe values used only for localized message formatting. Never raw content,
            credentials, tokens, or absolute host paths.
          items:
            type: string
            maxLength: 256

    Page:
      type: object
      description: |
        Cursor-paginated list envelope. Concrete list operations will replace the
        free-form `items` schema with a typed item; the pagination fields are stable.
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: [string, 'null']
          maxLength: 512
          description: Cursor for the next page, or `null` on the last page.
        total:
          type: integer
          minimum: 0
          description: Optional exact count. Omitted when counting would be unbounded.

    FileEntry:
      type: object
      additionalProperties: false
      required: [path, kind, size, revision, lastModified]
      properties:
        path:
          type: string
          maxLength: 1024
          description: Sandbox-relative path. Never an absolute host path.
        kind:
          type: string
          enum: [file, directory]
        size:
          type: integer
          minimum: 0
          description: File size in bytes; `0` for a directory.
        revision:
          type: [string, 'null']
          pattern: '^sha256:[0-9a-f]{64}$'
          description: |
            Full-file revision used as the `ETag` source. `null` for a directory.
        lastModified:
          type: string
          format: date-time
          description: Last modification time in UTC.

    FileList:
      type: object
      additionalProperties: false
      required: [path, items, nextCursor]
      properties:
        path:
          type: string
          maxLength: 1024
          description: Sandbox-relative path of the listed directory; empty means the root.
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/FileEntry'
        nextCursor:
          type: [string, 'null']
          maxLength: 512
          description: Opaque cursor for the next page, or `null` on the last page.
        total:
          type: integer
          minimum: 0
          description: Optional exact count. Omitted when counting would be unbounded.

    FileWriteResult:
      type: object
      additionalProperties: false
      required: [entry, validation]
      properties:
        entry:
          $ref: '#/components/schemas/FileEntry'
        validation:
          description: |
            Host-gate result for the committed bytes, or `null` when no validation gate is
            configured. Warnings never block a write.
          oneOf:
            - $ref: '#/components/schemas/ValidationResponse'
            - type: 'null'

    CreateEntryRequest:
      type: object
      additionalProperties: false
      required: [path, kind]
      properties:
        path:
          type: string
          maxLength: 1024
          description: Sandbox-relative path of the new entry. The sandbox root is rejected.
        kind:
          type: string
          enum: [file, directory]
        content:
          type: string
          description: |
            UTF-8 text content. Required for `file` and forbidden for `directory`.
            Binary content uses `POST /api/v1/files/upload`.
      if:
        properties:
          kind:
            const: file
      then:
        required: [content]
        properties:
          content:
            type: string
      else:
        properties:
          content: false

    MoveRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          maxLength: 1024
          description: Existing sandbox-relative source path. The sandbox root is rejected.
        to:
          type: string
          maxLength: 1024
          description: Sandbox-relative destination path. The sandbox root is rejected.
        overwrite:
          type: boolean
          default: false
          description: Replace an existing destination. A file source still needs `If-Match`.

    ValidateRequest:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path:
          type: string
          maxLength: 1024
          description: |
            Sandbox-relative path used only to select a validator. The path is resolved
            through the sandbox before any validator runs, and no file is written.
        content:
          type: string
          description: |
            UTF-8 text to validate. The server encodes it as UTF-8 bytes. Byte-exact
            validation of non-UTF-8 content happens through a write or upload request.

    ValidationResponse:
      type: object
      additionalProperties: false
      required: [path, matched, format, valid, issues]
      properties:
        path:
          type: string
          maxLength: 1024
          description: Sandbox-relative path that was validated.
        matched:
          type: boolean
          description: |
            `false` when no validator matches the path. An unmatched result must never be
            presented as validated.
        format:
          type: [string, 'null']
          enum: [yaml, json, toml, properties, null]
          description: Validator id, or `null` when unmatched.
        valid:
          type: boolean
          description: '`false` when at least one ERROR finding exists. Warnings do not block.'
        issues:
          type: array
          maxItems: 200
          description: Bounded by the host `maxIssues` budget (default 200).
          items:
            $ref: '#/components/schemas/ValidationFinding'

    ValidationFinding:
      type: object
      additionalProperties: false
      required: [severity, code, pointer, line, column, offset, detail]
      properties:
        severity:
          type: string
          enum: [ERROR, WARNING]
        code:
          type: string
          pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9-]*)+$'
          description: Stable issue code from the error catalog. Never localized.
        pointer:
          type: string
          maxLength: 1024
          description: |
            Empty for the whole document; otherwise an RFC 6901 JSON Pointer into the
            document. Never an absolute host path.
        line:
          type: integer
          minimum: 0
          description: 1-based decoded line, or 0 when unavailable.
        column:
          type: integer
          minimum: 0
          description: 1-based decoded column, or 0 when unavailable.
        offset:
          type: integer
          minimum: -1
          description: 0-based raw byte offset, or -1 when unavailable.
        detail:
          type: string
          maxLength: 1000
          description: Localized explanation negotiated through `Accept-Language`.
        parameters:
          type: array
          maxItems: 8
          description: Safe values used only for localized message formatting.
          items:
            type: string
            maxLength: 256
